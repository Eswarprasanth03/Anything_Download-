services:
  - type: web
    name: anything-download
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_HOSTED_MODE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "3"
      - key: MAX_QUEUE_SIZE
        value: "20"
      - key: MAX_ACTIVE_PER_GUEST
        value: "2"
      - key: MAX_DOWNLOAD_BYTES
        value: "209715200"
      - key: MAX_GUEST_STORAGE_BYTES
        value: "314572800"
      - key: MAX_TOTAL_STORAGE_BYTES
        value: "805306368"
      - key: MIN_FREE_DISK_BYTES
        value: "104857600"
      - key: FILE_TTL_MS
        value: "3600000"
      - key: JOB_RETENTION_MS
        value: "3600000"
      - key: CLEANUP_INTERVAL_MS
        value: "300000"
      - key: JOB_TIMEOUT_MS
        value: "300000"
